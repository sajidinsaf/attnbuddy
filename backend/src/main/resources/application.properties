spring.application.name=brasstacks

# JWT
jwt.secret=${JWT_SECRET:brasstacks-dev-secret-must-be-at-least-256-bits-long-change-in-production!!}

# Contact form SMTP (all values set in external config for prod)
contact.smtp.host=${CONTACT_SMTP_HOST:mail.visibleai.com}
contact.smtp.port=${CONTACT_SMTP_PORT:465}
contact.smtp.username=${CONTACT_SMTP_USERNAME:sajid@visibleai.com}
contact.smtp.password=${CONTACT_SMTP_PASSWORD:not-set}
contact.recipient=${CONTACT_RECIPIENT:sajid@visibleai.com}

# AI cost controls
ai.daily-limit=${AI_DAILY_LIMIT:50}
ai.hourly-limit=${AI_HOURLY_LIMIT:10}
ai.global-enabled=${AI_GLOBAL_ENABLED:true}
jwt.access-token-expiry=3600000
jwt.refresh-token-expiry=2592000000

# JPA
spring.jpa.open-in-view=false

# Profile is set by:
#   WAR on Tomcat: BrasstacksApplication.configure() sets "prod"
#   Local dev: mvn spring-boot:run -Dspring-boot.run.profiles=local
#   Tests: application-local.properties in test/resources
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
