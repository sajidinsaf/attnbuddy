# Local development profile

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:brasstacks;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Auto-create schema (Flyway disabled in local dev)
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# Disable Redis for local dev (auto-config won't fail if Redis isn't running)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Create non-JPA tables (ai_usage) after Hibernate schema generation
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Local base URL for verification emails
app.base-url=http://localhost:8080

# Disable OTel tracing locally (override with env vars to test)
management.tracing.sampling.probability=0.0

# Show SQL for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
