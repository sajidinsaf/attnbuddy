<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brasstacks - Contact Us</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 720px; margin: 0 auto; padding: 24px; background: #0F172A; color: #E2E8F0; line-height: 1.7; }
        h1 { color: #F8FAFC; font-size: 28px; margin-bottom: 8px; }
        p { font-size: 15px; color: #CBD5E1; margin-bottom: 12px; }
        a { color: #6366F1; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .breadcrumb { font-size: 13px; color: #64748B; margin-bottom: 24px; }
        .breadcrumb a { color: #64748B; }
        .breadcrumb a:hover { color: #94A3B8; }
        .intro { color: #94A3B8; font-size: 16px; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #F8FAFC; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 15px;
            font-family: inherit;
            color: #E2E8F0;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            border-color: #6366F1;
        }
        input::placeholder, textarea::placeholder { color: #475569; }
        textarea { min-height: 160px; resize: vertical; }
        .submit-btn {
            display: inline-block;
            background: #6366F1;
            color: #F8FAFC;
            font-size: 16px;
            font-weight: 600;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }
        .submit-btn:hover { background: #4F46E5; }
        .submit-btn:disabled { background: #334155; color: #64748B; cursor: not-allowed; }
        .message { padding: 14px 18px; border-radius: 8px; margin-top: 20px; font-size: 14px; display: none; }
        .message.success { display: block; background: #064E3B; border: 1px solid #065F46; color: #6EE7B7; }
        .message.error { display: block; background: #450A0A; border: 1px solid #7F1D1D; color: #FCA5A5; }
        .footer { margin-top: 48px; padding-top: 24px; border-top: 1px solid #1E293B; text-align: center; }
        .footer p { font-size: 13px; color: #475569; }
        .footer-links { margin-top: 12px; }
        .footer-links a { color: #64748B; font-size: 13px; margin: 0 12px; }
        .footer-links a:hover { color: #94A3B8; }
        @media (max-width: 600px) {
            body { padding: 16px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

    <p class="breadcrumb"><a href="index.html"><img src="logo.png" alt="Brasstacks" style="width: 32px; height: 32px; border-radius: 6px; vertical-align: middle; margin-right: 6px;">Brasstacks</a> &raquo; Contact</p>

    <h1>Contact Us</h1>
    <p class="intro">Have a question, suggestion, or feedback? We would love to hear from you. Fill out the form below and we will get back to you as soon as we can.</p>

    <form id="contactForm" novalidate>
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="What would you like to tell us?" required></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Send Message</button>
    </form>

    <div id="statusMessage" class="message"></div>

    <div class="footer">
        <p>&copy; 2026 <a href="https://visibleai.com">visibleai.com</a>. All rights reserved.</p>
        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms &amp; Conditions</a>
            <a href="guide.html">Guide</a>
        </div>
        <div class="footer-links" style="margin-top: 8px;">
            <a href="https://facebook.com/visibleai" target="_blank">Facebook</a>
            <a href="https://instagram.com/visibleai" target="_blank">Instagram</a>
            <a href="https://linkedin.com/company/visibleai" target="_blank">LinkedIn</a>
        </div>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            const statusEl = document.getElementById('statusMessage');
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('message').value.trim();

            // Basic validation
            if (!name || !email || !message) {
                statusEl.className = 'message error';
                statusEl.textContent = 'Please fill in all fields.';
                return;
            }

            // Simple email format check
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                statusEl.className = 'message error';
                statusEl.textContent = 'Please enter a valid email address.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Sending...';
            statusEl.className = 'message';
            statusEl.style.display = 'none';

            try {
                const response = await fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, message })
                });

                const data = await response.json();

                if (response.ok) {
                    statusEl.className = 'message success';
                    statusEl.textContent = 'Thank you! Your message has been sent. We will get back to you soon.';
                    document.getElementById('contactForm').reset();
                } else {
                    statusEl.className = 'message error';
                    statusEl.textContent = data.error || 'Something went wrong. Please try again later.';
                }
            } catch (err) {
                statusEl.className = 'message error';
                statusEl.textContent = 'Could not send your message. Please check your connection and try again.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Message';
            }
        });
    </script>

</body>
</html>
